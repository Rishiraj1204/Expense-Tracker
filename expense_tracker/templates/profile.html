{% extends 'base.html' %}

{% block title %}Profile{% endblock %}

{% block content %}
<h1>Profile</h1>
<div class="card form-card">
    <h3>Update Profile</h3>
    <form method="POST" action="{{ url_for('profile.update_profile') }}">
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" value="{{ user.name }}" placeholder="Full name" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ user.email }}" placeholder="Email address" required>
        </div>
        <div class="form-group">
            <label>Current Password</label>
            <input type="password" name="current_password" placeholder="Current password">
        </div>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="new_password" placeholder="New password">
        </div>
        <button class="button primary" type="submit">Update Profile</button>
    </form>
</div>
{% endblock %}
